<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Мэндлэх ёс</title>
    <meta
      name="description"
      content="Монголчуудын мэндлэх ёс заншил — Хэл ярианы соёл, Семинар III."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="loader" id="loader">
      <div class="loader__inner">
        <span class="loader__seal" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path class="ls-p" d="M6.6 25.4h18.8" />
            <path class="ls-p" d="M8.5 25.4v-9.1" />
            <path class="ls-p" d="M23.5 25.4v-9.1" />
            <path
              class="ls-p"
              d="M8.5 16.3C8.5 11.5 11.9 8 16 8s7.5 3.5 7.5 8.3"
            />
            <ellipse class="ls-p" cx="16" cy="8" rx="3.4" ry="1.35" />
            <path class="ls-p" d="M16 6.65V4.6" />
            <path class="ls-p" d="M8.5 20.4h15" />
            <path class="ls-p" d="M14.3 25.4v-4.2h3.4v4.2" />
          </svg>
        </span>
        <p class="loader__kicker">Хэл ярианы соёл · Семинар III</p>
        <div class="loader__word" aria-hidden="true">
          <span><i>М</i></span
          ><span><i>Э</i></span
          ><span><i>Н</i></span
          ><span><i>Д</i></span>
        </div>
        <div class="loader__meter">
          <div class="loader__bar"><i id="loaderBar"></i></div>
          <div class="loader__num">
            <span>Ачааллаж байна</span>
            <b><span id="loaderNum">0</span><small>%</small></b>
          </div>
        </div>
      </div>
      <div class="loader__sheet"></div>
    </div>

    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="cursor" id="cursor">
      <span class="cursor__dot"></span><span class="cursor__ring"></span>
    </div>

    <header class="topbar">
      <button class="topbar__mark" id="homeBtn" type="button">
        <span class="seal" aria-hidden="true">
          <svg
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="1.25"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6.6 25.4h18.8" />
            <path d="M8.5 25.4v-9.1" />
            <path d="M23.5 25.4v-9.1" />
            <path d="M8.5 16.3C8.5 11.5 11.9 8 16 8s7.5 3.5 7.5 8.3" />
            <ellipse cx="16" cy="8" rx="3.4" ry="1.35" />
            <path d="M16 6.65V4.6" />
            <path d="M8.5 20.4h15" />
            <path d="M14.3 25.4v-4.2h3.4v4.2" />
          </svg>
        </span>
        <span class="mark__txt">
          <b>Хэл ярианы соёл - 4-р баг</b>
        </span>
      </button>
      <div class="topbar__meta">
        <span id="secName"></span>
        <span class="topbar__count"
          ><u></u><i id="secNum">01</i><em id="secTot">/ 31</em></span
        >
      </div>
    </header>

    <div class="progress"><i id="progressBar"></i></div>
    <nav class="dots" id="dots" aria-label="Слайдууд"></nav>

    <main class="deck" id="deck">
      <!-- ══════ 01 НҮҮР ══════ -->
      <section class="slide slide--hero" data-name="Нүүр">
        <div class="hero__bg" aria-hidden="true">
          <img src="img/script.jpg" alt="" />
        </div>

        <!-- зүүн талын алхан хээ -->
        <div class="hero__khee" aria-hidden="true">
          <svg viewBox="0 0 230 920" preserveAspectRatio="xMinYMid slice">
            <defs>
              <pattern
                id="khee"
                x="-34"
                y="0"
                width="108"
                height="108"
                patternUnits="userSpaceOnUse"
              >
                <path
                  d="M16 94V16h76v60H36V36h40v24H56v-8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.6"
                />
              </pattern>
            </defs>
            <rect x="0" y="0" width="230" height="920" fill="url(#khee)" />
            <g fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="52" cy="168" r="96" />
              <circle cx="52" cy="168" r="74" />
              <circle cx="52" cy="168" r="30" />
              <path d="M52 94v148M-22 168h148" />
            </g>
          </svg>
        </div>

        <!-- баруун талын тооно схем -->
        <div class="hero__ger" aria-hidden="true">
          <svg viewBox="0 0 420 560" fill="none">
            <circle class="gd-r gd-c" cx="200" cy="200" r="158" />
            <g class="gd-u">
              <path d="M153 118L51.5 146" />
              <path d="M155.3 122.6L69 111.6" />
              <path d="M162 126.8L94.3 82.6" />
              <path d="M172.4 130.1L125.8 60.5" />
              <path d="M185.5 132.3L161.8 46.7" />
              <path d="M200 133L200 42" />
              <path d="M214.5 132.3L238.2 46.7" />
              <path d="M227.6 130.1L274.2 60.5" />
              <path d="M238 126.8L305.7 82.6" />
              <path d="M244.7 122.6L331 111.6" />
              <path d="M247 118L348.5 146" />
            </g>
            <ellipse class="gd-r" cx="200" cy="118" rx="47" ry="15" />
            <ellipse class="gd-r" cx="200" cy="118" rx="30" ry="9.5" />
            <g class="gd-d">
              <circle cx="92.1" cy="134.8" r="2.6" />
              <circle cx="121.4" cy="100.3" r="2.6" />
              <circle cx="171.3" cy="80.9" r="2.6" />
              <circle cx="228.7" cy="80.9" r="2.6" />
              <circle cx="278.6" cy="100.3" r="2.6" />
              <circle cx="307.9" cy="134.8" r="2.6" />
            </g>
            <path class="gd-b" d="M200 127.5V300" />
            <g class="gd-r">
              <path d="M186 300h28" />
              <path d="M200 300l14 22-14 22-14-22z" />
              <circle cx="200" cy="322" r="5.5" />
              <path d="M200 344v24" />
              <path d="M193 368h14" />
            </g>
            <g class="gd-t">
              <path d="M398 40V504" />
              <path d="M398 44 h-13" />
              <path d="M398 63 h-6" />
              <path d="M398 82 h-6" />
              <path d="M398 101 h-6" />
              <path d="M398 120 h-6" />
              <path d="M398 139 h-13" />
              <path d="M398 158 h-6" />
              <path d="M398 177 h-6" />
              <path d="M398 196 h-6" />
              <path d="M398 215 h-6" />
              <path d="M398 234 h-13" />
              <path d="M398 253 h-6" />
              <path d="M398 272 h-6" />
              <path d="M398 291 h-6" />
              <path d="M398 310 h-6" />
              <path d="M398 329 h-13" />
              <path d="M398 348 h-6" />
              <path d="M398 367 h-6" />
              <path d="M398 386 h-6" />
              <path d="M398 405 h-6" />
              <path d="M398 424 h-13" />
              <path d="M398 443 h-6" />
              <path d="M398 462 h-6" />
              <path d="M398 481 h-6" />
              <path d="M398 500 h-6" />
            </g>

            <path class="gd-t" d="M392 22h22" />
          </svg>
        </div>

        <div class="slide__inner">
          <div class="hero__eyebrow" data-anim>
            <span class="line"></span><span>Хэл ярианы соёл · Семинар III</span>
            <span class="hero__dot" aria-hidden="true"></span>
          </div>
          <h1 class="hero__title" data-anim data-split>Мэндлэх ёс</h1>
          <div class="hero__rule" data-anim></div>
          <p class="hero__sub" data-anim>
            Монгол хүний хүндэтгэлийн<br />анхны үг, анхны хөдөлгөөн.
          </p>
        </div>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
